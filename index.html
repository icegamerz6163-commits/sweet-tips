<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Tips - Support Creators</title>
    <style>
        :root {
            --primary-pink: #ff4d88;
            --light-pink: #fff0f5;
            --text-color: #333333;
            --bg-color: #f9f9f9;
            --white: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--white);
            width: 100%;
            max-width: 480px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
            box-sizing: border-box;
        }

        .logo-area {
            font-size: 40px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: #111;
        }

        p.subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--light-pink);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: left;
        }

        .card h3 {
            font-size: 15px;
            margin-top: 0;
            margin-bottom: 12px;
            color: var(--primary-pink);
        }

        .amount-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .amount-btn {
            background: var(--white);
            border: 2px solid #ffd1e3;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .amount-btn:hover, .amount-btn.active {
            border-color: var(--primary-pink);
            background-color: var(--primary-pink);
            color: var(--white);
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 12px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--primary-pink);
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        .support-btn {
            background-color: var(--primary-pink);
            color: var(--white);
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .support-btn:hover {
            opacity: 0.9;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-area">🍭</div>
        <h1>Support Sweet Tips</h1>
        <p class="subtitle">Fuel independent creators, game devs, and projects!</p>

        <div class="card">
            <h3>Send a Tip</h3>
            <div class="amount-buttons">
                <button class="amount-btn active" onclick="setAmount(3)">$3</button>
                <button class="amount-btn" onclick="setAmount(5)">$5</button>
                <button class="amount-btn" onclick="setAmount(10)">$10</button>
            </div>
            <input type="text" id="supporterName" placeholder="Your Name or @handle (optional)">
            <textarea id="supporterMessage" placeholder="Say something nice... (optional)"></textarea>
            <button class="support-btn" onclick="processTip()">Support $3</button>
        </div>

        <div class="footer">
            Powered by <strong>Sweet Tips</strong>
        </div>
    </div>

    <script>
        let currentAmount = 3;

        function setAmount(amount) {
            currentAmount = amount;
            document.querySelectorAll('.amount-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelector('.support-btn').innerText = `Support $${amount}`;
        }

        function processTip() {
            const name = document.getElementById('supporterName').value || 'Anonymous';
            const message = document.getElementById('supporterMessage').value;
            
            // Here is where you can plug in your Stripe Payment link or PayPal link later!
            alert(`Thanks for supporting with $${currentAmount}! (Payment gateway integration goes here).`);
        }
    </script>

</body>
</html>
