<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Sweet Tips</title>
    <script>
        // Redirects all path requests back to index.html so our router can catch them
        var pathSegmentsToKeep = 0;
        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
            (l.search ? '&q=' + l.search.slice(1) : '') +
            l.hash
        );
    </script>
</head>
<body></body>
</html>
